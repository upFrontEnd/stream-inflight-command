name: Annonces Twitch

# Toutes les 5 min (minimum autorisé par GitHub, horaire non garanti à la
# minute près). Le script ne poste rien hors live ni avant la fin de
# l'intervalle : la plupart des exécutions se terminent sans rien envoyer.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer tout de suite le prochain message (live ou pas)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # État = dernier créneau envoyé + position dans la rotation. On récupère
      # la sauvegarde la plus récente (préfixe), on en écrit une nouvelle à la fin.
      - name: Restaurer l'état
        uses: actions/cache/restore@v4
        with:
          path: announce-state.json
          key: announce-state-${{ github.run_id }}
          restore-keys: announce-state-

      - name: Envoyer l'annonce si c'est l'heure
        id: announce
        run: bun scripts/announce-action.mjs
        env:
          # Le Client ID n'est pas confidentiel : secret ou variable, au choix.
          # Le Client Secret doit rester un secret (masqué dans les logs).
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID || vars.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_CHANNEL: ${{ vars.TWITCH_CHANNEL || 'skyflyeraviation' }}
          ANNOUNCE_INTERVAL_MINUTES: ${{ vars.ANNOUNCE_INTERVAL_MINUTES || '30' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}

      - name: Sauvegarder l'état
        if: steps.announce.outputs.sent == 'true'
        uses: actions/cache/save@v4
        with:
          path: announce-state.json
          key: announce-state-${{ github.run_id }}

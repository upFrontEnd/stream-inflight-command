name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/deploy-ui.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build UI
        run: bun run build:ui
        env:
          GITHUB_ACTIONS: true
          VITE_WORKER_URL: https://stream-inflight-command.skyflyeraviation.workers.dev
          VITE_BOT_URL: https://stream-inflight-command-production.up.railway.app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

      - uses: actions/deploy-pages@v4
        id: deployment
